<!DOCTYPE html>
<html lang="ru">

    <title>Rocket Shift — закрытие дня (макет)</title>
    <link rel="stylesheet" href="mockups.css" />

    <div class="app-shell">

      <div class="percent-display" style="font-size: 2.5rem; padding: 16px">52,1%</div>

          <p class="victory-line">+1 ч к «Тренировка»</p>
          <p class="victory-line">Streak: 5 дней подряд</p>
        </div>
        <button type="button" class="btn-done">Готово</button>
      </div>
    </div>

</html>
